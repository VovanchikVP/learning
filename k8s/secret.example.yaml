# Скопировать в secret.yaml, подставить реальную строку подключения и применить.
# secret.yaml в git не коммитить (добавлен в .gitignore).
#
# Сервису нужен только SELECT по таблице с размеченными картинками.
apiVersion: v1
kind: Secret
metadata:
  name: continuous-learning-db
  namespace: rtt
type: Opaque
stringData:
  CL_PG_DSN: postgresql://user:password@postgres.default.svc.cluster.local:5432/dbname
