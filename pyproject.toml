[project]
name = "continuous-learning"
version = "0.1.0"
description = "Realtime OCR training service: two CRNN+CTC models (russian words / digits) continuously fine-tuned from a PostgreSQL table"
requires-python = ">=3.13"
dependencies = [
    "torch>=2.5",
    "pillow>=10.4",
    "numpy>=2.0",
    "asyncpg>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "sqlalchemy[asyncio]>=2.1.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# всё, что лежит в src/, попадает в пакет без промежуточной директории
only-include = ["src"]
sources = ["src"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.5",
]

[project.scripts]
continuous-learning = "cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: обучает настоящие модели, занимает десятки секунд",
    "integration: требует внешнего PostgreSQL (CL_TEST_PG_DSN)",
]
filterwarnings = ["ignore::DeprecationWarning"]

# Linux-образ собирается без CUDA: обучение в кластере идёт на CPU, а колёса
# nvidia-* добавили бы к образу несколько гигабайт. На macOS torch берётся
# с PyPI как раньше — там это сборка с MPS.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # правила самого ruff
]
ignore = [
    # комментарии и сообщения на русском: кириллические «с», «р», «х» ruff
    # считает похожими на латинские и ругается на каждую строку
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
# пакет разложен по src/ без промежуточной директории, поэтому все модули
# верхнего уровня — свои
known-first-party = [
    "api",
    "cli",
    "config",
    "constants",
    "demo",
    "models",
    "schemas",
    "services",
    "templates",
    "tests",
    "training",
    "utils",
]

[tool.mypy]
python_version = "3.13"
# проверяется только код сервиса: тесты подсовывают фейковый репозиторий
# вместо ImageRepository, и для mypy это пришлось бы описывать протоколом
files = ["src"]
mypy_path = "src"
# torch и часть зависимостей не раздают типы — проверяем только свой код
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
