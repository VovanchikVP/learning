[project]
name = "continuous-learning"
version = "0.1.0"
description = "Realtime OCR training service: two CRNN+CTC models (russian words / digits) continuously fine-tuned from a PostgreSQL table"
requires-python = ">=3.13"
dependencies = [
    "torch>=2.5",
    "pillow>=10.4",
    "numpy>=2.0",
    "asyncpg>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "sqlalchemy[asyncio]>=2.1.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# всё, что лежит в src/, попадает в пакет без промежуточной директории
only-include = ["src"]
sources = ["src"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]

[project.scripts]
continuous-learning = "cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: обучает настоящие модели, занимает десятки секунд",
    "integration: требует внешнего PostgreSQL (CL_TEST_PG_DSN)",
]
filterwarnings = ["ignore::DeprecationWarning"]
